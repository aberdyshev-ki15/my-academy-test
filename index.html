<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f4ef"><title>My Academy</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252a29;background:#f6f4ef}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:24px 18px 110px}.eyebrow{font-size:11px;letter-spacing:2px;color:#8b8d89;font-weight:700}h1{font-size:30px;margin:7px 0 24px;letter-spacing:-1px}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.muted{color:#777e7b;font-size:13px}.card{background:white;border:1px solid #eae8e2;border-radius:22px;padding:19px;margin:13px 0;box-shadow:0 3px 15px #27272708}.tag{font-size:12px;color:#777}.progress{height:9px;background:#eaece9;border-radius:12px;overflow:hidden;margin:13px 0}.progress span{display:block;height:100%;background:#667d73;transition:width .2s}.btn{background:#2f423b;color:white;border:0;border-radius:14px;padding:13px 16px;font-weight:650;cursor:pointer}.btn.secondary{background:#f0f1ed;color:#2f423b}.btn:active{transform:scale(.98)}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.line:last-child{border-bottom:0}.line label{display:flex;align-items:center;gap:9px}.line input{width:18px;height:18px;accent-color:#587369}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e7e7e3;display:flex;justify-content:space-around;padding:10px 3px max(12px,env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:none;color:#888;font-size:11px;padding:7px 5px;min-width:58px}.nav button.active{color:#30483e;font-weight:800}.nav b{display:block;font-size:20px;margin-bottom:3px}.option{width:100%;text-align:left;display:block;border:1px solid #e5e8e3;border-radius:14px;background:#fff;padding:13px;margin:8px 0;font-size:15px;color:#29342e}.option.selected{border-color:#567363;background:#edf4ef}.option.correct{border-color:#32835e;background:#e9f6ed}.option.wrong{border-color:#c15b5b;background:#fff0ee}input[type=time],select,input[type=number]{padding:10px;border:1px solid #ddd;border-radius:10px;background:white;font-size:15px}canvas{width:100%;height:190px} .week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{border:0;background:#f1f2ee;padding:12px 2px;border-radius:12px;color:#48544e}.day.active{background:#354b40;color:white}.hide{display:none}.notice{background:#eef4ef;padding:12px;border-radius:12px;margin:12px 0;font-size:13px}.small{font-size:12px}button{touch-action:manipulation}
</style></head><body><main id="app"></main><nav class="nav" id="nav"></nav>
<script>
(function(){
"use strict";
const lessons=[
{title:"Английский алфавит",topic:"Буквы A–G",theory:"Английский алфавит содержит 26 букв. Начнём с A (эй), B (би), C (си), D (ди), E (и), F (эф), G (джи).",word:"A B C D E F G",q:"Как произносится буква B?",opts:["би","бэ","ви"],correct:0},
{title:"Буквы H–N",topic:"Алфавит",theory:"H — эйч, I — ай, J — джей, K — кей, L — эл, M — эм, N — эн.",word:"H I J K L M N",q:"Как произносится I?",opts:["и","ай","эй"],correct:1},
{title:"Буквы O–U",topic:"Алфавит",theory:"O — оу, P — пи, Q — кью, R — ар, S — эс, T — ти, U — ю.",word:"O P Q R S T U",q:"Как произносится Q?",opts:["кью","ку","кей"],correct:0},
{title:"Буквы V–Z",topic:"Алфавит",theory:"V — ви, W — дабл-ю, X — экс, Y — уай, Z — зед (в американском английском также зи).",word:"V W X Y Z",q:"Как произносится W?",opts:["ви","дабл-ю","уай"],correct:1},
{title:"Приветствия",topic:"Первые фразы",theory:"Hello — привет. Good morning — доброе утро. Goodbye — до свидания. Повтори вслух.",word:"Hello. Good morning. Goodbye.",q:"Как сказать «доброе утро»?",opts:["Good night","Good morning","Goodbye"],correct:1},
{title:"Знакомство",topic:"Первые фразы",theory:"My name is Anna — Меня зовут Анна. What is your name? — Как тебя зовут?",word:"My name is Anna. What is your name?",q:"Что означает My name is...?",opts:["Мне нравится...","Меня зовут...","Я живу..."],correct:1},
{title:"Местоимения",topic:"Грамматика",theory:"I — я, you — ты/вы, he — он, she — она, we — мы, they — они.",word:"I. You. He. She. We. They.",q:"Как по-английски «мы»?",opts:["they","we","she"],correct:1},
{title:"Глагол to be",topic:"Грамматика",theory:"I am, you are, he/she is. Например: I am a student — Я студент.",word:"I am a student. She is happy.",q:"Выбери верное: She ___ happy.",opts:["am","are","is"],correct:2},
{title:"Числа 1–5",topic:"Слова",theory:"One — один, two — два, three — три, four — четыре, five — пять.",word:"One. Two. Three. Four. Five.",q:"Как сказать «три»?",opts:["three","four","two"],correct:0},
{title:"Числа 6–10",topic:"Слова",theory:"Six — шесть, seven — семь, eight — восемь, nine — девять, ten — десять.",word:"Six. Seven. Eight. Nine. Ten.",q:"Как сказать «восемь»?",opts:["nine","eight","seven"],correct:1},
{title:"Цвета",topic:"Слова",theory:"Red — красный, blue — синий, green — зелёный, white — белый, black — чёрный.",word:"Red. Blue. Green. White. Black.",q:"Как по-английски «зелёный»?",opts:["blue","black","green"],correct:2},
{title:"Семья",topic:"Слова",theory:"Mother — мама, father — папа, sister — сестра, brother — брат.",word:"Mother. Father. Sister. Brother.",q:"Как сказать «сестра»?",opts:["sister","mother","brother"],correct:0},
{title:"Артикли a/an",topic:"Грамматика",theory:"A ставится перед согласным звуком: a cat. An — перед гласным звуком: an apple.",word:"A cat. An apple.",q:"Выбери верное: ___ apple.",opts:["a","an","the a"],correct:1},
{title:"Простые вопросы",topic:"Разговор",theory:"How are you? — Как дела? I'm fine — У меня всё хорошо. Thank you — Спасибо.",word:"How are you? I'm fine, thank you.",q:"Что означает How are you?",opts:["Как дела?","Как тебя зовут?","Где ты?"],correct:0}
];
const key="my-academy-test-v1";let data;try{data=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){data={}}
data.done=data.done||{};data.schedule=data.schedule||{};data.answers=data.answers||{};data.day=data.day??new Date().getDay();let tab="home",current=0,choice=-1,weekOffset=0;
const days=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"],esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch(e){alert("Не удалось сохранить данные")}},completed=()=>Object.values(data.done).filter(Boolean).length,pct=()=>Math.round(completed()/lessons.length*100);
function tasks(d){if(!data.schedule[d])data.schedule[d]=[{time:"19:00",name:"Английский · урок",minutes:20,done:false},{time:"19:25",name:"Повторение слов",minutes:10,done:false}];return data.schedule[d]}
function speak(t){if(!("speechSynthesis" in window)){alert("Озвучивание не поддерживается");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}
const button=(t,fn,cls="")=>'<button class="btn '+cls+'" data-action="'+fn+'">'+t+'</button>';
function header(title,sub){return '<div class="eyebrow">MY ACADEMY · ENGLISH PRE-A1</div><h1>'+title+'</h1>'+(sub?'<p class="muted">'+sub+'</p>':'')}
function progress(){return '<div class="muted">Освоено уроков: '+completed()+' из '+lessons.length+'</div><div class="progress"><span style="width:'+pct()+'%"></span></div><b>'+pct()+'%</b>'}
function home(){let next=lessons.findIndex((_,i)=>!data.done[i]);if(next<0)next=0;return header("Моя академия","Твой персональный план обучения")+'<section class="card"><div class="tag">ТЕКУЩИЙ КУРС</div><h2>Английский с нуля</h2>'+progress()+'<p>Следующий урок: '+esc(lessons[next].title)+'</p>'+button("Продолжить урок","lesson:"+next)+'</section><section class="card"><h2>Сегодня по плану</h2>'+taskRows(new Date().getDay())+'<div class="btnrow">'+button("Открыть план","tab:plan","secondary")+'</div></section>'}
function taskRows(d){return tasks(d).map((t,i)=>'<div class="line"><label><input type="checkbox" data-action="task:'+d+':'+i+'" '+(t.done?'checked':'')+'><span style="'+(t.done?'text-decoration:line-through;color:#888':'')+'">'+esc(t.time)+' · '+esc(t.name)+' <span class="muted">('+t.minutes+' мин)</span></span></label></div>').join("")}
function lessonsPage(){return header("Уроки","От алфавита к первым диалогам")+'<section class="card">'+progress()+'</section>'+lessons.map((l,i)=>'<section class="card"><div class="tag">УРОК '+(i+1)+' · '+esc(l.topic)+'</div><h3>'+esc(l.title)+'</h3><p class="muted">'+(data.done[i]?'✓ Завершён':'Ожидает прохождения')+'</p>'+button(data.done[i]?"Повторить урок":"Начать урок","lesson:"+i,"secondary")+'</section>').join("")}
function lessonPage(i){let l=lessons[i];return header("Урок "+(i+1),l.topic)+'<section class="card"><h2>'+esc(l.title)+'</h2><p>'+esc(l.theory)+'</p>'+button("▶ Слушать произношение","speak:"+i,"secondary")+'<p class="muted">'+esc(l.word)+'</p></section><section class="card"><div class="tag">ПРОВЕРЬ СЕБЯ</div><h3>'+esc(l.q)+'</h3>'+l.opts.map((o,j)=>'<button class="option '+(choice===j?'selected':'')+'" data-action="answer:'+j+'">'+esc(o)+'</button>').join("")+(choice>=0?'<p class="notice">'+(choice===l.correct?'Верно! Отличная работа.':'Пока неверно. Попробуй ещё раз.')+'</p>':'')+'<div class="btnrow">'+button("Проверить и завершить","finish:"+i)+button("К списку уроков","tab:lessons","secondary")+'</div></section>'}
function plan(){let d=data.day;return header("Учебный план","Время занятий можно менять")+'<section class="card"><h2>Неделя</h2><div class="week">'+days.map((x,i)=>'<button class="day '+(d===i?'active':'')+'" data-action="day:'+i+'">'+x+'</button>').join("")+'</div><p class="muted">Выбран день: '+days[d]+'</p>'+taskRows(d)+'<div class="btnrow">'+button("+ Добавить занятие","add")+button("Изменить время","edit","secondary")+button("Перепланировать неделю","reschedule","secondary")+'</div></section><section class="card"><h2>Итоги недели</h2><p>'+Object.values(data.schedule).flat().filter(x=>x.done).length+' выполненных занятий</p><p class="muted">Отметки сохраняются на этом устройстве.</p></section>'}
function tutor(){return header("Репетитор","Тренировка фраз без подключения ИИ")+'<section class="card"><h2>Повторяй за мной</h2><p>Нажми на фразу, послушай и повтори вслух.</p>'+["Hello!","My name is Anna.","How are you?","I am fine, thank you.","Good morning!"].map((x,i)=>'<button class="option" data-action="phrase:'+i+'">'+esc(x)+' ▶</button>').join("")+'<p class="muted">Это тренажёр с озвучиванием. Настоящий ИИ-диалог и оценка произношения ещё не подключены.</p></section>'}
function chart(){let counts=Array.from({length:7},(_,d)=>tasks(d).filter(t=>t.done).length);let max=Math.max(2,...counts);return '<div style="display:flex;align-items:end;justify-content:space-between;gap:8px;height:155px;margin:20px 0 6px">'+counts.map((n,i)=>'<div style="flex:1;text-align:center"><div style="height:125px;display:flex;align-items:end;justify-content:center"><div style="width:80%;height:'+Math.max(3,n/max*120)+'px;background:#738b7d;border-radius:7px 7px 0 0"></div></div><div class="small muted">'+days[i]+'</div></div>').join("")+'</div>'}
function report(){return header("Прогресс","Результаты по фактически выполненным заданиям")+'<section class="card"><h2>Освоение курса</h2>'+progress()+'</section><section class="card"><h2>Занятия по дням недели</h2>'+chart()+'</section><section class="card"><h2>Твои достижения</h2><p>Завершено уроков: <b>'+completed()+'</b></p><p>Выполнено занятий: <b>'+Object.values(data.schedule).flat().filter(t=>t.done).length+'</b></p>'+button("Скачать отчёт","export","secondary")+'</section>'}
function render(){document.getElementById("app").innerHTML=tab==="home"?home():tab==="lessons"?lessonsPage():tab==="lesson"?lessonPage(current):tab==="tutor"?tutor():tab==="plan"?plan():report();document.getElementById("nav").innerHTML=[["home","⌂","Главная"],["lessons","▤","Уроки"],["tutor","◉","Репетитор"],["plan","▦","План"],["report","▥","Прогресс"]].map(([id,ico,name])=>'<button class="'+(tab===id?'active':'')+'" data-action="tab:'+id+'"><b>'+ico+'</b>'+name+'</button>').join("")}
document.addEventListener("click",function(e){let el=e.target.closest("[data-action]");if(!el)return;let [a,...rest]=el.dataset.action.split(":"),v=rest[0];if(a==="tab"){tab=v;choice=-1}if(a==="lesson"){current=+v;choice=-1;tab="lesson"}if(a==="answer"){choice=+v}if(a==="finish"){if(choice<0){alert("Сначала выбери ответ");return}if(choice!==lessons[+v].correct){alert("Ответ неверный. Попробуй ещё раз");return}data.done[v]=true;save();tab="lessons";choice=-1}if(a==="speak")speak(lessons[+v].word);if(a==="phrase")speak(["Hello!","My name is Anna.","How are you?","I am fine, thank you.","Good morning!"][+v]);if(a==="day")data.day=+v;if(a==="task"){let [d,i]=rest.map(Number);tasks(d)[i].done=el.checked;save()}if(a==="add"){let time=prompt("Время нового занятия (ЧЧ:ММ)","19:00");if(time===null)return;if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)){alert("Введи время в формате 19:00");return}tasks(data.day).push({time,name:"Дополнительное занятие",minutes:15,done:false});save()}if(a==="edit"){let t=tasks(data.day)[0];let time=prompt("Новое время первого занятия",t.time);if(time===null)return;if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)){alert("Неверный формат времени");return}t.time=time;save()}if(a==="reschedule"){if(confirm("Распределить занятия равномерно по неделе? Текущие отметки выполнения сохранятся.")){for(let i=0;i<7;i++){let t=tasks(i);t.forEach((x,j)=>{if(!x.done)x.time=j===0?"19:00":"19:25"})}save()}}if(a==="export"){let body="My Academy\nУроков: "+completed()+"/"+lessons.length+"\nЗанятий: "+Object.values(data.schedule).flat().filter(t=>t.done).length;let blob=new Blob([body],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="my-academy-report.txt";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render()});
render();
})();
</script></body></html>
